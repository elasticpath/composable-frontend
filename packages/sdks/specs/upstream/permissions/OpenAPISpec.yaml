      description: Update A Custom API Role Policy
      requestBody:
        $ref: '#/components/requestBodies/UpdateCustomAPIRolePolicy'
      responses:
        '200':
          $ref: '#/components/responses/CustomAPIRolePolicy'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Custom API Role Policies
      summary: Delete a Custom API Role Policy
      operationId: DeleteACustomAPIRolePolicy
      description: Delete A Custom API Role Policy
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/permissions/custom-user-roles:
    post:
      tags:
        - Custom User Roles
      summary: Create A Custom User Role
      operationId: CreateACustomUserRole
      description: Create A Custom User Role
      requestBody:
        $ref: '#/components/requestBodies/CreateCustomUserRole'
      responses:
        '201':
          $ref: '#/components/responses/CustomUserRole'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Custom User Roles
      summary: List Custom User Roles
      operationId: ListCustomUserRoles
      description: |
        Retrieves a list of Custom User Roles

        ## Filtering
        The following operators and attributes are available for [filtering](/guides/Getting-Started/filtering) Custom User Roles:

        | Attribute        | Operators                      | Example                                                  |
        |------------------|--------------------------------|----------------------------------------------------------|
        | `id`             | `lt`,`le`,`eq`,`gt`,`ge`,`in`  | `eq(id,3fa85f64-5717-4562-b3fc-2c963f66afa6)`            |
        | `name`           | `eq`                           | `eq(name,"Custom Role")`                                 |
        | `created_at`     | `lt`,`le`,`eq`,`gt`,`ge`       | `ge(created_at,2024-04-29T00:00:00.000Z)`                |
        | `updated_at`     | `lt`,`le`,`eq`,`gt`,`ge`       | `le(updated_at,2024-04-29T00:00:00.000Z)`                |

        ## Sorting
        The following attributes are available for sorting. When specified, the results are sorted in ascending order based on the value of the field. To sort in descending order, prefix the attribute with `-`, for example, `-updated_at`. The default sort order is `created_at` in descending order.
        - `id`
        - `name`
        - `created_at`
        - `updated_at`
      parameters:
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/CustomUserRoleSort'
      responses:
        '200':
          $ref: '#/components/responses/ListOfCustomUserRoles'
        '400':
          $ref: '#/components/responses/BadFilterError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/permissions/custom-user-roles/{custom-user-role-id}:
    parameters:
      - $ref: '#/components/parameters/CustomUserRoleID'
    get:
      tags:
        - Custom User Roles
      summary: Get a Custom User Role
      operationId: GetACustomUserRole
      description: Get A Custom User Role
      responses:
        '200':
          $ref: '#/components/responses/CustomUserRole'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Custom User Roles
      summary: Update a Custom User Role
      operationId: UpdateACustomUserRole
      description: Update A Custom User Role
      requestBody:
        $ref: '#/components/requestBodies/UpdateCustomUserRole'
      responses:
        '200':
          $ref: '#/components/responses/CustomUserRole'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Custom User Roles
      summary: Delete a Custom User Role
      operationId: DeleteACustomUserRole
      description: Delete A Custom User Role
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AccessLevels:
      type: object
      description: Specifies the access levels for each permission group.
      properties:
        accounts:
          type: string
          description: The access level for Accounts.
          enum:
            - none
            - view
            - manage
        application_keys:
          type: string
          description: The access level for Application Keys.
          enum:
            - none
            - view
            - manage
        authentication:
          type: string
          description: The access level for Authentication.
          enum:
            - none
            - view
            - manage
        catalog_releases:
          type: string
          description: The access level for Catalog Releases.
          enum:
            - none
            - view
            - manage
        catalog_search:
          type: string
          description: The access level for Catalog Search.
          enum:
            - none
            - view
            - manage
        catalogs:
          type: string
          description: The access level for Catalogs.
          enum:
            - none
            - view
            - manage
        composer:
          type: string
          description: The access level for Composer.
          enum:
            - none
            - manage
        content_and_pages:
          type: string
          description: The access level for Content and Pages. `content` (content creator) and `design` (designer) grant the same API access as `view` and set the Visual Builder access level. Only Custom User Roles can hold `content` or `design`.
          enum:
            - none
            - view
            - content
            - design
            - manage
        currencies:
          type: string
          description: The access level for Currencies.
          enum:
            - none
            - view
            - manage
        custom_actions:
          type: string
          description: The access level for Custom Actions.
          enum:
            - none
            - manage
        custom_apis:
          type: string
          description: The access level for Custom APIs.
          enum:
            - none
            - view
            - manage
        extended_attributes:
          type: string
          description: The access level for Extended Attributes.
          enum:
            - none
            - view
            - manage
        flows:
          type: string
          description: The access level for Flows.
          enum:
            - none
            - view
            - manage
        inventories:
          type: string
          description: The access level for Inventories.
          enum:
            - none
            - view
            - manage
        legacy_catalogs:
          type: string
          description: The access level for Legacy Catalogs.
          enum:
            - none
            - manage
        metrics:
          type: string
          description: The access level for Metrics.
          enum:
            - none
            - view
        orders:
          type: string
          description: The access level for Orders.
          enum:
            - none
            - view
            - manage
        payment_gateways:
          type: string
          description: The access level for Payment Gateways.
          enum:
            - none
            - view
            - manage
        personal_data:
          type: string
          description: The access level for Personal Data.
          enum:
            - none
            - view
            - manage
        price_books:
          type: string
          description: The access level for Price Books.
          enum:
            - none
            - view
            - manage
        products:
          type: string
          description: The access level for Products.
          enum:
            - none
            - view
            - manage
        promotions:
          type: string
          description: The access level for Promotions.
          enum:
            - none
            - view
            - manage
        settings:
          type: string
          description: The access level for Settings.
          enum:
            - none
            - view
            - manage
        subscription_billing:
          type: string
          description: The access level for Subscription Billing.
          enum:
            - none
            - view
            - manage
        subscription_jobs:
          type: string
          description: The access level for Subscription Jobs.
          enum:
            - none
            - view
            - manage
        subscription_offerings:
          type: string
          description: The access level for Subscription Offerings.
          enum:
            - none
            - view
            - manage
        subscription_subscribers:
          type: string
          description: The access level for Subscription Subscribers.
          enum:
            - none
            - view
            - manage
        team:
          type: string
          description: The access level for Team.
          enum:
            - none
            - view
            - manage
        webhooks:
          type: string
          description: The access level for Webhooks.
          enum:
            - none
            - view
            - manage
    LinkURI:
      type:
        - string
        - 'null'
      format: uri
    StandardUserRole:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the Standard User Role.
        type:
          type: string
          description: Specifies the type of the resource object, use `standard_user_role` for Standard User Roles.
          const: standard_user_role
        name:
          type: string
          description: Specifies the name of the Standard User Role.
        access_levels:
          $ref: '#/components/schemas/AccessLevels'
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/LinkURI'
              description: Specifies the URI of the Standard User Role.
              example: /v2/permissions/standard-user-roles/it-developer
    Errors:
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
              - status
              - title
            properties:
              status:
                type: string
                description: The HTTP response code of the error.
                format: string
                examples:
                  - '400'
              title:
                type: string
                description: A brief summary of the error.
                examples:
                  - Bad Request
              detail:
                type: string
                description: Optional additional detail about the error.
                examples:
                  - The field 'name' is required
    StandardShopperRole:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the Standard Shopper Role.
        type:
          type: string
          description: Specifies the type of the resource object, use `standard_shopper_role` for Standard Shopper Roles.
          const: standard_shopper_role
        name:
          type: string
          description: Specifies the name of the Standard Shopper Role.
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/LinkURI'
              description: Specifies the URI of the Standard Shopper Role.
              example: /v2/permissions/standard-shopper-roles/guest-shopper
    Timestamps:
      type: object
      properties:
        created_at:
          type: string
          description: Specifies the date the entity is created.
          example: '2017-01-10T11:41:19.244Z'
        updated_at:
          type: string
          description: Specifies the date the entity is last updated.
          example: '2017-01-10T11:41:19.244Z'
    Meta:
      type: object
      properties:
        timestamps:
          $ref: '#/components/schemas/Timestamps'
    CustomAPIRolePolicyRelationships:
      type: object
      properties:
        custom_api:
          type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                  description: The unique identifier for the related Custom API.
                  example: 652e39d8-d613-493e-8c20-fef99ad6327a
                type:
                  type: string
                  description: Specifies the type of the resource object.
                  const: custom_api
        role:
          type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                  description: The unique identifier for the related Role.
                  example: it-developer
                type:
                  type: string
                  description: Specifies the type of the resource object.
                  enum:
                    - standard_user_role
                    - standard_shopper_role
                    - custom_user_role
    CustomAPIRolePolicy:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the Custom API Role Policy.
          format: uuid
        type:
          type: string
          description: Specifies the type of the resource object, use `custom_api_role_policy` for Custom API Role Policies.
          const: custom_api_role_policy
        create:
          type: boolean
          description: Specifies if the Role can create a Custom API Entry.
        list:
          type: boolean
          description: Specifies if the Role can retrieve a list of Custom API Entries.
        read:
          type: boolean
          description: Specifies if the Role can get a Custom API Entry.
        update:
          type: boolean
          description: Specifies if the Role can update a Custom API Entry.
        delete:
          type: boolean
          description: Specifies if the Role can delete a Custom API Entry.
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/LinkURI'
              description: Specifies the URI of the Custom API Role Policy.
              example: /v2/permissions/custom-api-role-policies/3fa85f64-5717-4562-b3fc-2c963f66afa6
        meta:
          $ref: '#/components/schemas/Meta'
        relationships:
          $ref: '#/components/schemas/CustomAPIRolePolicyRelationships'
    PaginationMeta:
      type: object
      properties:
        results:
          type: object
          properties:
            total:
              type: integer
              description: Total number of results for the entire collection.
        page:
          type: object
          properties:
            limit:
              type: integer
              description: The maximum number of records for all pages.
              example: 100
            offset:
              type: integer
              description: The current offset by number of pages.
              example: 0
            current:
              type: integer
              description: The current number of pages.
              example: 1
            total:
              type: integer
              description: The total number of pages.
              example: 1
    PaginationLinks:
      type: object
      properties:
        current:
          $ref: '#/components/schemas/LinkURI'
          description: Always the current page.
          example: /v2/settings/custom-apis?page[offset]=0&page[limit]=100
        first:
          $ref: '#/components/schemas/LinkURI'
          description: Always the first page.
          example: /v2/settings/custom-apis?page[offset]=0&page[limit]=100
        last:
          $ref: '#/components/schemas/LinkURI'
          description: Always `null` if there is only one page.
          example: /v2/settings/custom-apis?page[offset]=0&page[limit]=100
        next:
          $ref: '#/components/schemas/LinkURI'
          description: Always `null` if there is only one page.
          example: null
        prev:
          $ref: '#/components/schemas/LinkURI'
          description: Always `null` if on the first page.
          example: null
    CustomUserRoleAccessLevels:
      allOf:
        - $ref: '#/components/schemas/AccessLevels'
        - type: object
          properties:
            custom_actions:
              type: string
              description: The access level for Custom Actions. Custom Actions are not available to Custom User Roles, so this must be `none`.
              enum:
                - none
            extended_attributes:
              type: string
              description: Custom User Roles must have at least view access to Extended Attributes, so this must be `view` or `manage`.
              enum:
                - view
                - manage
            team:
              type: string
              description: The access level for Team. Team management is not available to Custom User Roles, so this must be `none`.
              enum:
                - none
    InheritMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          properties:
            owner:
              type: string
              enum:
                - organization
                - store
              description: Specifies whether the resource is managed in the organization or store.
    CustomUserRole:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the Custom User Role.
          format: uuid
        type:
          type: string
          description: Specifies the type of the resource object, use `custom_user_role` for Custom User Roles.
          const: custom_user_role
        name:
          type: string
          description: The name of the role.
        description:
          type: string
          description: The description of the role.
        access_levels:
          $ref: '#/components/schemas/CustomUserRoleAccessLevels'
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/LinkURI'
              description: Specifies the URI of the Custom User Role.
              example: /v2/permissions/custom-user-roles/3fa85f64-5717-4562-b3fc-2c963f66afa6
        meta:
          $ref: '#/components/schemas/InheritMeta'
  responses:
    ListOfStandardUserRoles:
      description: List of Standard User Roles
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/StandardUserRole'
    ValidationError:
      description: Bad request. The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          examples:
            missing-name:
              summary: Required field missing
              value: |
                {
                  "errors": [
                    {
                      "title": "Bad Request",
                      "status": "400",
                      "detail": "The field 'name' is required."
                    }
                  ]
                }
    InternalServerError:
      description: Internal server error. There was a system failure in the platform.
      content:
