    SearchRuleTrigger:
      type: object
      description: Defines when a search rule matches a shopper query.
      properties:
        query:
          type: string
          minLength: 1
          description: Trigger text compared against the normalized shopper query. Omit for a browse trigger.
          example: drill
        match:
          type: string
          enum:
            - exact
            - contains
            - browse
          default: exact
          description: |
            `exact` — normalized query must equal `query`.
            `contains` — `query` must appear as a substring in the normalized query.
            `browse` — matches a non-autocomplete wildcard query (`q=*`); omit `query`.
          example: exact
    SearchRuleActions:
      type: object
      description: Actions applied when a rule matches. Provide at least one boost/bury condition, product pin, product hide, query replacement, or result filter.
      properties:
        boosts:
          type: array
          description: One or more boost/bury conditions using standard `filter_by` syntax. Weights affect product ranking when the rule matches.
          items:
            $ref: '#/components/schemas/SearchBoostRule'
        pins:
          type: array
          description: Products to fix at one-based global result positions when the rule matches. Pinned products still respect active filters.
          items:
            $ref: '#/components/schemas/SearchPinRule'
        hides:
          type: array
          description: Products to exclude from results when the rule matches.
          items:
            $ref: '#/components/schemas/SearchHideRule'
        replace_query:
          type: string
          description: Query text to use for the search after this rule matches.
          minLength: 1
          example: drill
        filter_by:
          type: string
          description: Filter expression to apply to search results when the rule matches.
          minLength: 1
          example: extensions.products(Details).BRAND-NAME:=Milwaukee
    SearchRuleAttributes:
      type: object
      description: Attributes of a search rule within a group.
      required:
        - execution_order
        - trigger
        - actions
      properties:
        slug:
          type: string
          description: Optional human-readable identifier for the rule within the group.
          example: boost-milwaukee
        description:
          type: string
          description: Optional summary of what the rule does for merchandisers.
          example: Boost Milwaukee brand on exact drill query
        execution_order:
          type: integer
          minimum: 1
          description: Lower values run first within the group and win conflicts over later rules. Must be unique per group.
          example: 1
        trigger:
          $ref: '#/components/schemas/SearchRuleTrigger'
        actions:
          $ref: '#/components/schemas/SearchRuleActions'
        stop_after_match:
          type: boolean
          default: false
          description: When `true` and this rule matches, rules with a higher `execution_order` are not evaluated — including rules in other attached groups on the profile.
          example: false
    SearchRuleMeta:
