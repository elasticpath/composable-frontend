          example: name
          minLength: 1
        type:
          $ref: '#/components/schemas/FieldType'
        searchable:
          type: boolean
          description: Whether the field can be used for full-text search as a query field in a search profile. Only text fields are searchable.
          example: true
        filterable:
          type: boolean
          description: Whether the field can be used in filter expressions.
          example: true
        facetable:
          type: boolean
          description: Enables faceting on the field.
          default: false
          example: true
        sortable:
          type: boolean
          description: 'When set to true, the field will be sortable. Default: true for numbers, false otherwise.'
          example: true
        locale:
          type: string
          description: Language the field's text is indexed with, as an [ISO 639-1 code](https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes). Text fields always report a locale — en unless another was configured — and this is the locale a synonym must match to expand when the field is the highest-weighted search field. Fields that are not text report no locale.
          default: en
          example: en
