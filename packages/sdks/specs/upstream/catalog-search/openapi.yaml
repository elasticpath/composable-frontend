components:
  securitySchemes:
    BearerToken:
      scheme: bearer
      type: http
  headers:
    ep-search-profile:
      description: |
        Slug of the search profile resolved for this request.

        On success (2xx): the profile actually applied. When the built-in default is used, the value is the reserved sentinel `SYSTEMS_DEFAULT_PROFILE`.

        On 400 when profile resolution ran: the slug that was attempted (for example an invalid `search_profile` query value), or the resolved slug when a later validation step failed.

        Omitted when the request fails before profile resolution (for example a malformed search body).

        `SYSTEMS_DEFAULT_PROFILE` is reserved — tenants cannot create a search profile with that slug.
      schema:
        type: string
      example: SYSTEMS_DEFAULT_PROFILE
  responses:
    InternalServerError:
      description: Internal server error. There was a system failure in the platform.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal-server-error:
              value:
                errors:
                  - title: Internal Server Error
                    status: '500'
  schemas:
    MoveSearchRuleRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - catalog_search_rule
              example: catalog_search_rule
            attributes:
              type: object
              required:
                - placement
              properties:
                placement:
                  type: string
                  enum:
                    - before
                    - after
                    - first
                    - last
                  example: before
                target_rule_id:
                  type: string
                  format: uuid
                  example: 8fccaa19-dba9-4621-8d11-31a222a68c7c
    ReindexTenantReleasesJobRequest:
      type: object
      properties:
        data:
          description: The primary data for the request.
          type: object
          properties:
