          $ref: '#/components/schemas/SearchProfileUpdateRequestData'
    SearchProfileUpdateRequestData:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          description: The unique identifier of the search profile. Must match the ID specified in the request path.
          type: string
          format: uuid
          example: 805103ff-0a37-4f83-8fe0-95a16039bd98
          x-go-name: ID
        type:
          $ref: '#/components/schemas/SearchProfileType'
        attributes:
          $ref: '#/components/schemas/SearchProfileUpdateAttributes'
    SearchProfileUpdateAttributes:
      type: object
      properties:
        slug:
          type: string
          description: The unique slug of the search profile. A slug can contain A to Z, a to z, 0 to 9, hyphen, underscore, and period. Spaces or other special characters like ^, [], *, and $ are not allowed. The sentinel `SYSTEMS_DEFAULT_PROFILE` is reserved for the built-in default and cannot be used as a tenant profile slug.
          example: default
          pattern: ^[a-zA-Z0-9_.-]+$
          minLength: 1
        description:
          type: string
          description: The description of the search profile.
          example: Default search profile
        fields:
          type: array
          description: A collection of search fields
          minItems: 1
          items:
            $ref: '#/components/schemas/SearchField'
        text_match_type:
          $ref: '#/components/schemas/TextMatchType'
        filters:
          type: array
          description: |
            Optional list of filter expressions to apply to search results. Multiple filters in the array are combined using OR logic (records matching filter1 || filter2 || ... filterN).
            To combine conditions with AND logic, include multiple conditions within a single filter string (e.g., "meta.search.categories.lvl1:=`All Products > Mens Shoes` && meta.display_price.without_tax.float_price:>100").
            These profile-level filters are ANDed with any filters provided in the search request via the filter_by parameter, resulting in: (profile_filter1 || profile_filter2 || ... profile_filterN) && request_filters.
          items:
            type: string
            example: meta.search.categories.lvl1:=`All Products > Mens Shoes`
            minLength: 1
        exclusions:
          type: array
          description: A collection of exclusion expressions to apply to search results. Multiple exclusions in the array are combined using OR logic (records matching exclusion1 || exclusion2 || ... exclusionN).
          items:
            type: string
            example: meta.search.categories.lvl1:=`All Products > Mens Shoes`
            minLength: 1
        boosts:
          type: array
          items:
            $ref: '#/components/schemas/SearchBoostRule'
        prefix:
          type: boolean
          nullable: true
          description: |
            Profile-level default for prefix (partial match) behavior on the last query token. When true, the last word in the query is treated as a prefix for all fields that do not have an explicit per-field prefix value. For example, a search request for "red app" matches "red apple". When false, the last word must match exactly. If omitted, default of true applies. Per-field prefix values override this setting.
            The primary use case is to show results as the user is typing in the search box.
          example: true
        typo_tolerance:
          $ref: '#/components/schemas/TypoTolerance'
        synonym_settings:
          $ref: '#/components/schemas/SynonymSettings'
        synonym_sets:
          type: array
          description: |
            Optional list of synonym set IDs to apply at search time. Each synonym set must exist and must have been synced to the search engine at least once. Organization-level search profiles may only reference organization-level synonym sets. Store-level search profiles may reference organization-level and same-store synonym sets. Set to an empty array to remove all synonym sets from the search profile.
          items:
            type: string
            format: uuid
            example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        rule_groups:
          type: array
          description: |
            Optional search rule group IDs. When non-empty, the query-time rules engine runs on every search for this profile; rule actions apply only when a trigger matches. Set to `[]` to disable rules and use profile-only behaviour.
          items:
            type: string
            format: uuid
            example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        force_use_default_price_for_faceting_and_sorting:
          type: boolean
          description: When set to true, the default price is used for faceting and sorting for segmented catalogs even if the catalog rule has a supported price book.
          example: true
