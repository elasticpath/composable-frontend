          get-v2-authentication-realms-realmId-oidc-profiles: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-oidc-profiles.yaml
          get-v2-authentication-realms-realmId-oidc-profiles-profileId: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-oidc-profiles-profileId.yaml
          get-v2-authentication-realms-realmId-password-profiles: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-password-profiles.yaml
          get-v2-authentication-realms-realmId-password-profiles-profileId: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-password-profiles-profileId.yaml
          get-v2-authentication-realms-realmId-user-authentication-info: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-user-authentication-info.yaml
          get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId.yaml
          get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-oidc-profile-info: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-oidc-profile-info.yaml
          get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-oidc-profile-info-oidcInfoId: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-oidc-profile-info-oidcInfoId.yaml
          get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-password-profile-info: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-password-profile-info.yaml
          get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-password-profile-info-passwordProfileInfoId: ../overrides/mcp/authentication-realms/get-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-password-profile-info-passwordProfileInfoId.yaml
          post-v2-authentication-realms-realmId-oidc-profiles: ../overrides/mcp/authentication-realms/post-v2-authentication-realms-realmId-oidc-profiles.yaml
          post-v2-authentication-realms-realmId-password-profiles: ../overrides/mcp/authentication-realms/post-v2-authentication-realms-realmId-password-profiles.yaml
          post-v2-authentication-realms-realmId-password-profiles-profileId-one-time-password-token-request: ../overrides/mcp/authentication-realms/post-v2-authentication-realms-realmId-password-profiles-profileId-one-time-password-token-request.yaml
