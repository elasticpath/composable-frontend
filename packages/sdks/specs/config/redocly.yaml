          delete-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-password-profile-info-passwordProfileInfoId: ../overrides/mcp/authentication-realms/delete-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-password-profile-info-passwordProfileInfoId.yaml
          get-oidc-idp-login-stores-storeId-authentication-realms-realmId: ../overrides/mcp/authentication-realms/get-oidc-idp-login-stores-storeId-authentication-realms-realmId.yaml
