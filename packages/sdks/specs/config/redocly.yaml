extends:
  - recommended

apis:
  cart-checkout@v1:
    root: ../cart_checkout.yaml
    output: ../bundled/cart_checkout.yaml
    decorators:
      override/component-merge:
        # Kept here, not in the spec, which a refresh would overwrite.
        mergeRef:
          # Order matters: cart_checkout_components.yaml $refs CartItemObject, which the union file adds.
          - ../overrides/cart_checkout_item_union.yaml
          - ../overrides/cart_checkout_components.yaml
      override/operation-property-override:
        operationIds:
          getACart: ../overrides/getACart.yaml
          getCustomerOrders: ../overrides/getCustomerOrders.yaml
          getAnOrder: ../overrides/getAnOrder.yaml
      ops-extras/prefix-components:
        prefix: CartCheckout
        targets:
          - schemas
        filterKeys:
          - Timestamps
  cart-checkout-standalone@v1:
    root: ../cart_checkout.yaml
    output: ../bundled/cart_checkout_standalone.yaml
    decorators:
      override/component-merge:
        mergeRef:
          - ../overrides/cart_checkout_item_union.yaml
  authentication@v1:
    root: ../authentication.yaml
    output: ../bundled/authentication.yaml
    decorators:
      ops-extras/prefix-components:
        prefix: Authentication
        targets:
          - responses
        filterKeys:
          - InternalServerError
  catalog_view@v1:
    output: ../bundled/catalog_view.yaml
    root: ../catalog_view.yaml
  # Same root as catalog_view@v1, different output: the /catalogs half, for its own package.
  catalogs@v1:
    output: ../bundled/catalogs.yaml
    root: ../catalog_view.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - admin
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - getCatalogs
          - createCatalog
          - getCatalogByID
          - updateCatalog
          - deleteCatalogByID
          - getReleases
          - publishRelease
          - deleteReleases
          - getReleaseByID
          - deleteReleaseByID
          - getRules
          - createRule
          - getRuleByID
          - updateRule
          - deleteRuleByID
          - validateCatalogRules
          - getAllHierarchies
          - getHierarchy
          - getHierarchyNodes
          - getHierarchyChildNodes
          - getAllNodes
          - getNode
          - getChildNodes
          - getAllProducts
          - getProduct
          - getAllRelatedProducts
          - getComponentProductIDs
          - getChildProducts
          - getProductsForHierarchy
          - getProductsForNode
  subscriptions@v1:
    output: ../bundled/subscriptions.yaml
    root: ../subscriptions.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - ListOfferings
          - GetOffering
          - ListOfferingPricingOptions
          - ListOfferingFeatures
          - ListOfferingPlans
          - ListOfferingPlanPricingOptions
          - ListSubscriptions
          - GetSubscription
          - ListSubscriptionPlans
          - ListSubscriptionPricingOptions
          - CreateSubscriptionState
          - ListSubscriptionStates
          - GetSubscriptionState
          - ListSubscriptionInvoices
          - ListSubscriptionInvoicePayments
          - GetSubscriptionInvoicePayment
          - GetSubscriptionInvoice
          - ListInvoices
          - GetInvoice
          - GetFeature
      ops-extras/prefix-paths:
        prefix: /v2
      ops-extras/remove-v2-server: true
      ops-extras/prefix-components:
        prefix: Subscriptions
        targets:
          - schemas
          - parameters
          - responses
        filterKeys:
          - Filter
          - PageLimit
          - PageOffset
          - TransactionResponse
          - Timestamps
          - ErrorResponse
          - Error
          - UUID
          - NotFoundError
          - ValidationError
          - InternalServerError
          - SingleRelationship
  inventories@v1:
    output: ../bundled/inventories.yaml
    root: ../inventories.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - GetStock
          - ListLocations
      ops-extras/prefix-paths:
        prefix: /v2
      ops-extras/remove-v2-server: true
      ops-extras/prefix-components:
        prefix: Inventories
        targets:
          - schemas
          - parameters
          - responses
        filterKeys:
          - Filter
          - PageLimit
          - PageOffset
          - TransactionResponse
          - Timestamps
          - ErrorResponse
          - Error
          - UUID
          - NotFoundError
          - ValidationError
          # Collide by name and shape with subscriptions' in the shopper join.
          - Import
          - ImportAttributes
          - ImportMeta
          - ImportRecords
          - JobTimestamps
      ops-extras/prefix-tags:
        prefix: Inventories
        filterTags:
          - Transactions
          # Same collision, on the tag.
          - Imports
  account_management@v1:
    output: ../bundled/account_management.yaml
    root: ../account_management.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - post-v2-accounts
          - get-v2-accounts
          - get-v2-accounts-accountID
          - put-v2-accounts-accountID
          - get-v2-account-members
          - get-v2-account-members-accountMemberID
          - get-v2-accounts-accountID-account-memberships
          - post-v2-account-members-tokens
      ops-extras/prefix-components:
        prefix: AccountManagement
        targets:
          - schemas
          - responses
        filterKeys:
          - Error
          - MetaTimestamps
          - InternalServerError
          - BadRequestError
          - ErrorResponse
          - UnauthorizedError
          - ForbiddenError
  account_addresses@v1:
    output: ../bundled/account-addresses.yaml
    root: ../account-addresses.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
      ops-extras/prefix-components:
        prefix: AccountAddresses
        targets:
          - schemas
          - responses
        filterKeys:
          - Error
          - MetaTimestamps
          - ErrorResponse
  authentication_realms@v1:
    output: ../bundled/authentication-realms.yaml
    root: ../authentication-realms.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
  currencies@v1:
    output: ../bundled/currencies.yaml
    root: ../currencies.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - getAllCurrencies
          - getACurrency
  files@v1:
    output: ../bundled/files.yaml
    root: ../files.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - getAllFiles
          - getAFile
      ops-extras/prefix-components:
        prefix: Files
        targets:
          - schemas
          - responses
          - parameters
        filterKeys:
          - Links
          - Error
          - UUID
          - ForbiddenError
          - InternalServerError
          - NotFoundError
          - filter
          - page-limit
          - page-offset
          - ErrorResponse
  catalog_search@v1:
    output: ../bundled/catalog_search.yaml
    root: &catalog_search_root ../catalog_search.yaml
    preprocessors: &catalog_search_preprocessors
      ops-extras/prefix-components:
        prefix: CatalogSearch
        targets:
          - schemas
          - responses
        filterKeys:
          - Error
          - InternalServerError
          - ErrorResponse
          - Product
  # Same bundle as catalog_search@v1, under its own output so two builds never write one file.
  catalog_search-standalone@v1:
    output: ../bundled/catalog_search_standalone.yaml
    root: *catalog_search_root
    preprocessors: *catalog_search_preprocessors
plugins:
  - ../plugins/override.js
  - ../plugins/ops-extra.js

decorators:
  override/component-merge:
    mergeRef: ../overrides/security-schemes.yaml
  remove-x-internal: on