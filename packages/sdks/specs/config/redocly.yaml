extends:
  - recommended

apis:
  cart-checkout@v1:
    root: ../cart_checkout.yaml
    output: ../bundled/cart_checkout.yaml
    decorators:
      override/component-merge:
        # Kept here, not in the spec, which a refresh would overwrite.
        mergeRef:
          # Order matters: cart_checkout_components.yaml $refs CartItemObject, which the union file adds.
          - ../overrides/cart_checkout_item_union.yaml
          - ../overrides/cart_checkout_checkout_discriminators.yaml
          - ../overrides/cart_checkout_components.yaml
      override/operation-property-override:
        operationIds:
          getACart: ../overrides/getACart.yaml
          getCustomerOrders: ../overrides/getCustomerOrders.yaml
          getAnOrder: ../overrides/getAnOrder.yaml
      ops-extras/prefix-components:
        prefix: CartCheckout
        targets:
          - schemas
        filterKeys:
          - Timestamps
  cart-checkout-standalone@v1:
    root: ../cart_checkout.yaml
    output: ../bundled/cart_checkout_standalone.yaml
    decorators:
      override/component-merge:
        mergeRef:
          - ../overrides/cart_checkout_item_union.yaml
          - ../overrides/cart_checkout_checkout_discriminators.yaml
          - ../overrides/cart_checkout_service_corrections.yaml
      override/operation-property-override:
        operationIds:
          getCarts: ../overrides/mcp/cart-checkout-order/getCarts.yaml
          createACart: ../overrides/mcp/cart-checkout-order/createACart.yaml
          getACart: ../overrides/mcp/cart-checkout-order/getACart.yaml
          updateACart: ../overrides/mcp/cart-checkout-order/updateACart.yaml
          deleteACart: ../overrides/mcp/cart-checkout-order/deleteACart.yaml
          getCartItems: ../overrides/mcp/cart-checkout-order/getCartItems.yaml
          manageCarts: ../overrides/mcp/cart-checkout-order/manageCarts.yaml
          bulkUpdateItemsInCart: ../overrides/mcp/cart-checkout-order/bulkUpdateItemsInCart.yaml
          deleteAllCartItems: ../overrides/mcp/cart-checkout-order/deleteAllCartItems.yaml
          updateACartItem: ../overrides/mcp/cart-checkout-order/updateACartItem.yaml
          deleteACartItem: ../overrides/mcp/cart-checkout-order/deleteACartItem.yaml
          createAccountCartAssociation: ../overrides/mcp/cart-checkout-order/createAccountCartAssociation.yaml
          deleteAccountCartAssociation: ../overrides/mcp/cart-checkout-order/deleteAccountCartAssociation.yaml
          createCustomerCartAssociation: ../overrides/mcp/cart-checkout-order/createCustomerCartAssociation.yaml
          deleteCustomerCartAssociation: ../overrides/mcp/cart-checkout-order/deleteCustomerCartAssociation.yaml
          deleteAPromotionViaPromotionCode: ../overrides/mcp/cart-checkout-order/deleteAPromotionViaPromotionCode.yaml
          addTaxItemToCart: ../overrides/mcp/cart-checkout-order/addTaxItemToCart.yaml
          addTaxItemToCartItemComponent: ../overrides/mcp/cart-checkout-order/addTaxItemToCartItemComponent.yaml
          updateTaxItemFromCartItemComponent: ../overrides/mcp/cart-checkout-order/updateTaxItemFromCartItemComponent.yaml
          deleteTaxItemFromCartItemComponent: ../overrides/mcp/cart-checkout-order/deleteTaxItemFromCartItemComponent.yaml
          bulkAddTaxItemsToCart: ../overrides/mcp/cart-checkout-order/bulkAddTaxItemsToCart.yaml
          bulkDeleteTaxItemsFromCart: ../overrides/mcp/cart-checkout-order/bulkDeleteTaxItemsFromCart.yaml
          updateATaxItem: ../overrides/mcp/cart-checkout-order/updateATaxItem.yaml
          deleteATaxItem: ../overrides/mcp/cart-checkout-order/deleteATaxItem.yaml
          bulkAddCustomDiscountsToCart: ../overrides/mcp/cart-checkout-order/bulkAddCustomDiscountsToCart.yaml
          bulkDeleteCustomDiscountsFromCart: ../overrides/mcp/cart-checkout-order/bulkDeleteCustomDiscountsFromCart.yaml
          updateCustomDiscountForCart: ../overrides/mcp/cart-checkout-order/updateCustomDiscountForCart.yaml
          deleteCustomDiscountFromCart: ../overrides/mcp/cart-checkout-order/deleteCustomDiscountFromCart.yaml
          addCustomDiscountToCartItem: ../overrides/mcp/cart-checkout-order/addCustomDiscountToCartItem.yaml
          updateCustomDiscountForCartItem: ../overrides/mcp/cart-checkout-order/updateCustomDiscountForCartItem.yaml
          deleteCustomDiscountFromCartItem: ../overrides/mcp/cart-checkout-order/deleteCustomDiscountFromCartItem.yaml
          getShippingGroups: ../overrides/mcp/cart-checkout-order/getShippingGroups.yaml
          createShippingGroup: ../overrides/mcp/cart-checkout-order/createShippingGroup.yaml
          getShippingGroupById: ../overrides/mcp/cart-checkout-order/getShippingGroupById.yaml
          updateShippingGroup: ../overrides/mcp/cart-checkout-order/updateShippingGroup.yaml
          deleteCartShippingGroup: ../overrides/mcp/cart-checkout-order/deleteCartShippingGroup.yaml
          createCartPaymentIntent: ../overrides/mcp/cart-checkout-order/createCartPaymentIntent.yaml
          updateCartPaymentIntent: ../overrides/mcp/cart-checkout-order/updateCartPaymentIntent.yaml
          checkoutAPI: ../overrides/mcp/cart-checkout-order/checkoutAPI.yaml
          getCustomerOrders: ../overrides/mcp/cart-checkout-order/getCustomerOrders.yaml
          getAnOrder: ../overrides/mcp/cart-checkout-order/getAnOrder.yaml
          updateAnOrder: ../overrides/mcp/cart-checkout-order/updateAnOrder.yaml
          getOrderItems: ../overrides/mcp/cart-checkout-order/getOrderItems.yaml
          anonymizeOrders: ../overrides/mcp/cart-checkout-order/anonymizeOrders.yaml
          confirmOrder: ../overrides/mcp/cart-checkout-order/confirmOrder.yaml
          paymentSetup: ../overrides/mcp/cart-checkout-order/paymentSetup.yaml
          confirmPayment: ../overrides/mcp/cart-checkout-order/confirmPayment.yaml
          captureATransaction: ../overrides/mcp/cart-checkout-order/captureATransaction.yaml
          refundATransaction: ../overrides/mcp/cart-checkout-order/refundATransaction.yaml
          getOrderTransactions: ../overrides/mcp/cart-checkout-order/getOrderTransactions.yaml
          getATransaction: ../overrides/mcp/cart-checkout-order/getATransaction.yaml
          cancelATransaction: ../overrides/mcp/cart-checkout-order/cancelATransaction.yaml
          getOrderShippingGroups: ../overrides/mcp/cart-checkout-order/getOrderShippingGroups.yaml
          createOrderShippingGroup: ../overrides/mcp/cart-checkout-order/createOrderShippingGroup.yaml
          getShippingGroupsById: ../overrides/mcp/cart-checkout-order/getShippingGroupsById.yaml
          putShippingGroupById: ../overrides/mcp/cart-checkout-order/putShippingGroupById.yaml
          get-v2-settings-cart: ../overrides/mcp/cart-checkout-order/get-v2-settings-cart.yaml
          put-v2-settings-cart: ../overrides/mcp/cart-checkout-order/put-v2-settings-cart.yaml
          get-v2-settings-cart-storeID: ../overrides/mcp/cart-checkout-order/get-v2-settings-cart-storeID.yaml
          put-v2-settings-cart-storeID: ../overrides/mcp/cart-checkout-order/put-v2-settings-cart-storeID.yaml
  authentication@v1:
    root: ../authentication.yaml
    output: ../bundled/authentication.yaml
    decorators:
      ops-extras/prefix-components:
        prefix: Authentication
        targets:
          - responses
        filterKeys:
          - InternalServerError
  catalog_view@v1:
    output: ../bundled/catalog_view.yaml
    root: ../catalog_view.yaml
  # Same root as catalog_view@v1, different output: the /catalogs and /catalog operations, for its own package.
  catalogs@v1:
    output: ../bundled/catalogs.yaml
    root: ../catalog_view.yaml
    decorators:
      override/operation-property-override:
        operationIds:
          getCatalogs: ../overrides/mcp/catalogs/getCatalogs.yaml
          createCatalog: ../overrides/mcp/catalogs/createCatalog.yaml
          getCatalogByID: ../overrides/mcp/catalogs/getCatalogByID.yaml
          updateCatalog: ../overrides/mcp/catalogs/updateCatalog.yaml
          deleteCatalogByID: ../overrides/mcp/catalogs/deleteCatalogByID.yaml
          publishRelease: ../overrides/mcp/catalogs/publishRelease.yaml
          getReleases: ../overrides/mcp/catalogs/getReleases.yaml
          deleteReleases: ../overrides/mcp/catalogs/deleteReleases.yaml
          getReleaseByID: ../overrides/mcp/catalogs/getReleaseByID.yaml
          deleteReleaseByID: ../overrides/mcp/catalogs/deleteReleaseByID.yaml
          createRule: ../overrides/mcp/catalogs/createRule.yaml
          getRules: ../overrides/mcp/catalogs/getRules.yaml
          getRuleByID: ../overrides/mcp/catalogs/getRuleByID.yaml
          updateRule: ../overrides/mcp/catalogs/updateRule.yaml
          deleteRuleByID: ../overrides/mcp/catalogs/deleteRuleByID.yaml
          validateCatalogRules: ../overrides/mcp/catalogs/validateCatalogRules.yaml
          getAllHierarchies: ../overrides/mcp/catalogs/getAllHierarchies.yaml
          getHierarchy: ../overrides/mcp/catalogs/getHierarchy.yaml
          getHierarchyNodes: ../overrides/mcp/catalogs/getHierarchyNodes.yaml
          getHierarchyChildNodes: ../overrides/mcp/catalogs/getHierarchyChildNodes.yaml
          getAllNodes: ../overrides/mcp/catalogs/getAllNodes.yaml
          getNode: ../overrides/mcp/catalogs/getNode.yaml
          getChildNodes: ../overrides/mcp/catalogs/getChildNodes.yaml
          getAllProducts: ../overrides/mcp/catalogs/getAllProducts.yaml
          getProduct: ../overrides/mcp/catalogs/getProduct.yaml
          getAllRelatedProducts: ../overrides/mcp/catalogs/getAllRelatedProducts.yaml
          getComponentProductIDs: ../overrides/mcp/catalogs/getComponentProductIDs.yaml
          getChildProducts: ../overrides/mcp/catalogs/getChildProducts.yaml
          getProductsForHierarchy: ../overrides/mcp/catalogs/getProductsForHierarchy.yaml
          getProductsForNode: ../overrides/mcp/catalogs/getProductsForNode.yaml
          configureByContextProduct: ../overrides/mcp/catalogs/configureByContextProduct.yaml
          getByContextAllHierarchies: ../overrides/mcp/catalogs/getByContextAllHierarchies.yaml
          getByContextAllNodes: ../overrides/mcp/catalogs/getByContextAllNodes.yaml
          getByContextAllProducts: ../overrides/mcp/catalogs/getByContextAllProducts.yaml
          getByContextAllRelatedProducts: ../overrides/mcp/catalogs/getByContextAllRelatedProducts.yaml
          getByContextChildNodes: ../overrides/mcp/catalogs/getByContextChildNodes.yaml
          getByContextChildProducts: ../overrides/mcp/catalogs/getByContextChildProducts.yaml
          getByContextComponentProductIDs: ../overrides/mcp/catalogs/getByContextComponentProductIDs.yaml
          getByContextHierarchy: ../overrides/mcp/catalogs/getByContextHierarchy.yaml
          getByContextHierarchyChildNodes: ../overrides/mcp/catalogs/getByContextHierarchyChildNodes.yaml
          getByContextHierarchyNodes: ../overrides/mcp/catalogs/getByContextHierarchyNodes.yaml
          getByContextNode: ../overrides/mcp/catalogs/getByContextNode.yaml
          getByContextProduct: ../overrides/mcp/catalogs/getByContextProduct.yaml
          getByContextProductsForHierarchy: ../overrides/mcp/catalogs/getByContextProductsForHierarchy.yaml
          getByContextProductsForNode: ../overrides/mcp/catalogs/getByContextProductsForNode.yaml
          getByContextRelease: ../overrides/mcp/catalogs/getByContextRelease.yaml
  subscriptions@v1:
    output: ../bundled/subscriptions.yaml
    root: ../subscriptions.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - ListOfferings
          - GetOffering
          - ListOfferingPricingOptions
          - ListOfferingFeatures
          - ListOfferingPlans
          - ListOfferingPlanPricingOptions
          - ListSubscriptions
          - GetSubscription
          - ListSubscriptionPlans
          - ListSubscriptionPricingOptions
          - CreateSubscriptionState
          - ListSubscriptionStates
          - GetSubscriptionState
          - ListSubscriptionInvoices
          - ListSubscriptionInvoicePayments
          - GetSubscriptionInvoicePayment
          - GetSubscriptionInvoice
          - ListInvoices
          - GetInvoice
          - GetFeature
      ops-extras/prefix-paths:
        prefix: /v2
      ops-extras/remove-v2-server: true
      ops-extras/prefix-components:
        prefix: Subscriptions
        targets:
          - schemas
          - parameters
          - responses
        filterKeys:
          - Filter
          - PageLimit
          - PageOffset
          - TransactionResponse
          - Timestamps
          - ErrorResponse
          - Error
          - UUID
          - NotFoundError
          - ValidationError
          - InternalServerError
          - SingleRelationship
  inventories@v1:
    output: ../bundled/inventories.yaml
    root: ../inventories.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - GetStock
          - ListLocations
      ops-extras/prefix-paths:
        prefix: /v2
      ops-extras/remove-v2-server: true
      ops-extras/prefix-components:
        prefix: Inventories
        targets:
          - schemas
          - parameters
          - responses
        filterKeys:
          - Filter
          - PageLimit
          - PageOffset
          - TransactionResponse
          - Timestamps
          - ErrorResponse
          - Error
          - UUID
          - NotFoundError
          - ValidationError
          # Collide by name and shape with subscriptions' in the shopper join.
          - Import
          - ImportAttributes
          - ImportMeta
          - ImportRecords
          - JobTimestamps
      ops-extras/prefix-tags:
        prefix: Inventories
        filterTags:
          - Transactions
          # Same collision, on the tag.
          - Imports
  account_management@v1:
    output: ../bundled/account_management.yaml
    root: ../account_management.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - post-v2-accounts
          - get-v2-accounts
          - get-v2-accounts-accountID
          - put-v2-accounts-accountID
          - get-v2-account-members
          - get-v2-account-members-accountMemberID
          - get-v2-accounts-accountID-account-memberships
          - post-v2-account-members-tokens
      ops-extras/prefix-components:
        prefix: AccountManagement
        targets:
          - schemas
          - responses
        filterKeys:
          - Error
          - MetaTimestamps
          - InternalServerError
          - BadRequestError
          - ErrorResponse
          - UnauthorizedError
          - ForbiddenError
  account_addresses@v1:
    output: ../bundled/account-addresses.yaml
    root: ../account-addresses.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - get-v2-account-addresses
          - post-v2-account-address
          - get-v2-account-address
          - put-v2-account-address
          - delete-v2-account-address
      ops-extras/prefix-components:
        prefix: AccountAddresses
        targets:
          - schemas
          - responses
        filterKeys:
          - Error
          - MetaTimestamps
          - ErrorResponse
  authentication_realms@v1:
    output: ../bundled/authentication-realms.yaml
    root: ../authentication-realms.yaml
    decorators:
      # Kept here, not in the spec, which a refresh would overwrite.
      override/component-merge:
        mergeRef:
          - ../overrides/authentication_realms_service_shapes.yaml
          # The shopper allow-list now keeps the user authentication info update, so the
          # partial-update body has to be merged here too. The standalone bundle merges the
          # same file.
          - ../overrides/authentication_realms_user_auth_info_update.yaml
          - ../overrides/authentication_realms_operation_ids.yaml
    preprocessors:
      ops-extras/filter-operations-by-extension:
        extensionName: x-sdk-filter
        extensionValues:
          - shopper
        # Kept here, not as x-sdk-filter in the spec, which a refresh would delete.
        operationIds:
          - post-v2-authentication-realms-realmId-password-profiles-profileId-one-time-password-token-request
          - put-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId
          - put-v2-authentication-realms-realmId-user-authentication-info-userAuthInfoId-user-authentication-password-profile-info-passwordProfileInfoId
      ops-extras/prefix-components:
        prefix: AuthenticationRealms
        targets:
          - schemas
          - parameters
          - responses
          - securitySchemes
        filterKeys:
          - Error
          - ErrorResponse
          - UUID
          - SelfLink
          - MetaTimestamps
          - PaginationLinks
          - PaginationMeta
          - BearerToken
          - filter
          - page-limit
          - page-offset
          - BadRequestError
          - UnauthorizedError
          - NotFoundError
          - InternalServerError
          - UnprocessableEntityError
  # Same root as authentication_realms@v1, different output: every operation, no prefixes,
  # for the package's own client. Only the shape corrections are shared.
  # The package generates from this bundle, so the service corrections reach it too.
  authentication-realms-standalone@v1:
    output: ../bundled/authentication-realms_standalone.yaml
    root: ../authentication-realms.yaml
    decorators:
      override/operation-property-override:
        operationIds:
          delete-v2-authentication-realms-realmId-oidc-profiles-profileId: ../overrides/mcp/authentication-realms/delete-v2-authentication-realms-realmId-oidc-profiles-profileId.yaml
