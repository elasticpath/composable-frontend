# The user authentication info update is a partial update, which the published spec does not
# model. Only the package's own bundle applies this: no user-authentication-info operation
# survives the shopper filter.
components:
  schemas:
    # The user authentication info update is a partial update: the handler null-checks every
    # field and requires `type` alone. Carried forward from #606.
    UserAuthenticationInfoUpdateInput:
      type: object
      properties:
        type:
          type: string
          description: Specifies the type of object. Set this value to `user_authentication_info`.
          const: user_authentication_info
        name:
          type: string
          description: Specifies the name of the user.
        given_name:
          type:
            - string
            - "null"
          description: Specifies the given name of the user.
        family_name:
          type:
            - string
            - "null"
          description: Specifies the family name of the user.
        middle_name:
          type:
            - string
            - "null"
          description: Specifies the middle name of the user.
        email:
          type: string
          format: email
          description: Specifies the email address of the user.
      required:
        - type
paths:
  /v2/authentication-realms/{realmId}/user-authentication-info/{userAuthInfoId}:
    put:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                data:
                  $ref: "#/components/schemas/UserAuthenticationInfoUpdateInput"
