x-mcp-title: Get a Shopper Node's Products
x-mcp-description: >-
  Lists the live products associated with one hierarchy node in the catalog that
  the shopper's context selects, using the catalog rule that best matches it.
  Curated products are returned in the node's curated order, flagged
  curated_product: true. For a whole hierarchy, read the hierarchy's products
  instead.
