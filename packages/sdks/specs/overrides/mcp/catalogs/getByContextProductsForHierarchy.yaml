x-mcp-title: Get a Shopper Hierarchy's Products
x-mcp-description: >-
  Lists the live products associated with one hierarchy in the catalog that the
  shopper's context selects, using the catalog rule that best matches it. Use it
  for a whole hierarchy; for a single node's products, read that node's products
  instead. To read a specific catalog and release by ID, use the catalog reads.
