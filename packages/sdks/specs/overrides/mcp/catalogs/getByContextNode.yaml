x-mcp-title: Get a Shopper Catalog Node
x-mcp-description: >-
  Gets one node by ID from the catalog that the shopper's context selects, using
  the catalog rule that best matches it. Its breadcrumbs metadata names the
  parent nodes it belongs to, and any curated products are listed in
  curated_products. To read a specific catalog and release by ID instead, use
  the catalog node reads.
