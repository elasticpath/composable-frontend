x-mcp-title: Get a Shopper Hierarchy's Nodes
x-mcp-description: >-
  Lists every node in one hierarchy, at all levels, from the catalog that the
  shopper's context selects, using the catalog rule that best matches it. Filter
  by name, slug or id. For only the nodes directly under the hierarchy, list its
  top-level nodes instead. To read a specific catalog and release by ID, use the
  catalog hierarchy reads.
