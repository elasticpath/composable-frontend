x-mcp-title: Get Shopper Catalog Hierarchies
x-mcp-description: >-
  Lists the hierarchies of the catalog that the shopper's context selects, using
  the catalog rule that best matches it. Use it to browse the structure the
  shopper sees or find a hierarchy ID, and filter by name, slug or id. To read a
  specific catalog and release by ID instead, use the catalog hierarchy reads.
