x-mcp-description: >-
  Creates a rule promotion: a cart, item or shipping discount with eligibility
  rules. Requires name, enabled, start, end (no offset means UTC) and rule_set
  with rules and actions. rules is one object; combine with strategy "and" and
  children. item_category args are node IDs, not names, and a parent node
  covers its children. item_sku takes SKUs, item_product_id product IDs.
  account_tags takes account tag IDs, not names, and only matches carts of a
  signed-in account member, never guest carts. It applies automatically, or
  only with codes added afterwards.
