x-mcp-name: authentication_realms_create_password_profile
x-mcp-description: >-
  Creates a password profile in an authentication realm, so users can sign in
  with a username and password. Set a name, the username format (email or any)
  and whether one-time password token requests are enabled; they are off by
  default. Only the account management realm supports password profiles. To give
  a user a login, create their password profile info afterwards.
