x-mcp-description: >-
  Requests a one-time password token for a username in a password profile, for a
  password reset or passwordless sign-in. Set the purpose to reset_password or
  passwordless_authentication. The token is not returned: it is sent in an event
  for an integration to deliver. An unknown username is accepted without error,
  and the call is rejected if the profile has one-time password tokens disabled.
