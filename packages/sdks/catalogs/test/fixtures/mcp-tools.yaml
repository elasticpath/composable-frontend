openapi: 3.1.0
info:
  title: MCP tools fixture
  version: 1.0.0
servers:
  - url: https://example.com
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: Lists every widget.
      deprecated: true
      responses:
        "200":
          description: The widgets.
    post:
      operationId: createWidget
      summary: Create a widget
      description: Creates a widget from the spec's own description.
      x-mcp-title: Make a widget
      x-mcp-description: Makes one widget. Use it to add a widget to the list.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
        - name: EP-Channel
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "201":
          description: The widget.
  /widgets/legacy:
    get:
      operationId: listLegacyWidgets
      summary: List legacy widgets
      description: Deprecated. Use listWidgets instead.
      deprecated: true
      responses:
        "200":
          description: The widgets.
  /widgets/old:
    get:
      operationId: listOldWidgets
      summary: List old widgets
      description: Lists the old widgets.
      x-mcp-description: Lists widgets made before 2020.
      deprecated: true
      responses:
        "200":
          description: The widgets.
  /widgets/retired:
    get:
      operationId: listRetiredWidgets
      summary: List retired widgets
      x-mcp-description: Deprecated in favour of listing every widget.
      deprecated: true
      responses:
        "200":
          description: The widgets.
  /widgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAWidget
      summary: Get a widget
      description: |-
        Returns one widget
        by its ID.

        The second paragraph is left out.
      responses:
        "200":
          description: The widget.
    put:
      operationId: updateAWidget
      summary: Update a widget
      responses:
        "200":
          description: The widget.
    delete:
      operationId: deleteAWidget
      summary: Delete a widget
      description: Delete a widget.
      responses:
        "204":
          description: Deleted.
  /widgets/{id}/image:
    post:
      operationId: uploadWidgetImage
      summary: Upload a widget image
      x-mcp-max-file-bytes: 16
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  description: The image to upload.
                  type: string
                  format: binary
                caption:
                  type: string
      responses:
        "201":
          description: The image.
  /widgets/{id}/attachments:
    post:
      operationId: attachWidgetFile
      summary: Attach a file to a widget
      x-mcp-max-file-bytes: 1024
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  format: binary
                attachment_location:
                  type: string
      responses:
        "201":
          description: The attachment.
  /widgets/tokens:
    post:
      operationId: createWidgetToken
      summary: Create a widget token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
      responses:
        "200":
          description: The token.
  /widgets/{id}/history/{entryId}/revisions/{revisionId}/attachments/{attachmentId}:
    get:
      operationId: getWidgetHistoryEntryRevisionAttachmentByIdentifiers
      summary: Get a widget history attachment
      x-mcp-name: fixture_get_widget_history_attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: entryId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The attachment.
