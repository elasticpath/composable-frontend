# Runs every package's tests on a pull request. Merging to main publishes to npm, and the
# release workflow runs no tests, so this is the only check that a change to a package or to
# the spec-sync scripts gets before it is published.
name: Package tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "pnpm"

      # The composable-cli build reads this file, as release.yml makes it before building.
      - name: Make .env file for composable-cli package
        run: |
          touch ./packages/composable-cli/.env
          echo POSTHOG_PUBLIC_API_KEY=${{ secrets.POSTHOG_PUBLIC_API_KEY }} >> ./packages/composable-cli/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm build:packages

      # d2c-schematics is left out: its tests need `pnpm generate` first and one of them fails
      # on main regardless. The package is legacy and no example depends on it.
      - name: Test every package
        run: pnpm exec turbo run test --filter='./packages/*' --filter='./packages/sdks/*' --filter='!@elasticpath/d2c-schematics'

      - name: Test the spec-sync scripts
        run: pnpm test:spec-sync
